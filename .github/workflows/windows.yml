name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_RELEASE_DEBUG: 0
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify stable upstream pin
        run: python scripts/upstream.py check --latest
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@0b201ec70fa439e89abeca8adcc46fa8b1d7afad9
      - name: Verify and configure upstream V8 binaries
        run: python scripts/setup_v8.py x86_64-pc-windows-msvc
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Windows tests including software-rendered scrolling and wrapped-link fixture
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --lib
      - name: Build GUI
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin codex-gui
      - name: Build upstream runtime helpers
        run: ./scripts/build-helpers.ps1
      - name: Package Windows executables and licenses
        run: ./scripts/package-windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-gui-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
