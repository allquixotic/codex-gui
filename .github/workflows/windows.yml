name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Upstream's long snapshot filenames are checked out even when TUI is not built.
      CARGO_HOME: D:/c
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_RELEASE_DEBUG: 0
      # Whole-program LTO takes ~50 minutes per executable on hosted runners.
      # Keep normal optimized static builds, with bounded compilation memory.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      STABLE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Enable Git long paths
        run: git config --global core.longpaths true
      - name: Verify stable upstream pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/upstream.py check --latest
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            D:/c
            target
            .patched
          key: windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            windows-rust-
      - name: Prepare stable Bedrock backport
        run: python scripts/upstream.py prepare
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Configure MSVC tools
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Verify and configure upstream V8 binaries
        run: python scripts/setup_v8.py x86_64-pc-windows-msvc
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Windows tests including software-rendered scrolling and wrapped-link fixture
        id: tests
        run: cargo test --locked --release --target x86_64-pc-windows-msvc --lib
      - name: Build GUI
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin codex-gui
      - name: Build upstream runtime helpers
        run: ./scripts/build-helpers.ps1
      - name: Save Rust build cache
        if: always() && steps.tests.outcome != 'skipped' && !cancelled()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            D:/c
            target
            .patched
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Windows GUI smoke test (mock provider, suggested and free-text answers)
        run: python dev/windows-smoke.py target/x86_64-pc-windows-msvc/release/codex-gui.exe
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-smoke-evidence
          path: dist/smoke/
          if-no-files-found: ignore
      - name: Windows purpose, resize, persistence and conversation-selection smoke test
        run: |
          python dev/windows-native-menu-driver-check.py
          if ($LASTEXITCODE -ne 0) { throw 'Native menu automation probe failed' }
          python dev/windows-purpose-selection-smoke.py target/x86_64-pc-windows-msvc/release/codex-gui.exe
      - name: Windows conversation controls, tooltip and read-state regression
        run: python dev/windows-conversation-smoke.py target/x86_64-pc-windows-msvc/release/codex-gui.exe
      - name: Upload conversation evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-conversation-evidence
          path: dist/conversation-smoke/
          if-no-files-found: ignore
      - name: Upload purpose and selection evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-purpose-selection-evidence
          path: dist/purpose-selection-smoke/
          if-no-files-found: ignore
      # Azure trusts only this repository's immutable OIDC subject on main.
      # PRs continue to build unsigned packages without Azure access.
      - name: Sign in to Azure for Windows signing
        if: github.repository == 'allquixotic/codex-gui' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables
        if: github.repository == 'allquixotic/codex-gui' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: allquixotic-signing
          certificate-profile-name: windows-public
          files: |
            ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/codex-gui.exe
            ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/codex-code-mode-host.exe
            ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/codex-windows-sandbox-setup.exe
            ${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/codex-command-runner.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
      - name: Verify Windows signatures before packaging
        if: github.repository == 'allquixotic/codex-gui' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          $executables = 'codex-gui.exe', 'codex-code-mode-host.exe', 'codex-windows-sandbox-setup.exe', 'codex-command-runner.exe'
          foreach ($executable in $executables) {
            $path = Join-Path 'target/x86_64-pc-windows-msvc/release' $executable
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -ne 'CN=Sean McNamara, O=Sean McNamara, L=Pasadena, S=MD, C=US' -or
                $null -eq $signature.TimeStamperCertificate) {
              throw "Missing, invalid, untimestamped, or unexpected signature on ${executable}: $($signature.Status)"
            }
            Write-Host "Verified $executable signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Package Windows executables and licenses
        run: ./scripts/package-windows.ps1
      - name: Attest signed Windows package
        if: github.repository == 'allquixotic/codex-gui' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Preserve Windows attestation bundle
        if: steps.provenance.outcome == 'success'
        run: Copy-Item '${{ steps.provenance.outputs.bundle-path }}' dist/windows-attestation.sigstore.json
      - name: Upload Windows package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-gui-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*attestation.sigstore.json
          if-no-files-found: error
          retention-days: 30
