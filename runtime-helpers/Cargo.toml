# Compile pristine stable entrypoints against the consumer's pinned backend graph.
# No Rust source or upstream workspace lockfile is copied or modified.
[package]
name = "gui-runtime-helpers"
version = "0.162.0"
edition = "2024"
license = "Apache-2.0"
autobins = false
publish = false

[[bin]]
name = "codex-code-mode-host"
path = "../.upstream/codex-rs/code-mode-host/src/main.rs"
test = false

[[bin]]
name = "codex-windows-sandbox-setup"
path = "../.upstream/codex-rs/windows-sandbox-rs/src/bin/setup_main/main.rs"
test = false

[[bin]]
name = "codex-command-runner"
path = "../.upstream/codex-rs/windows-sandbox-rs/src/bin/command_runner/main.rs"
test = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-code-mode-host = { workspace = true }
codex-http-client = { workspace = true }
codex-otel = { workspace = true }
codex-otel-trace-websocket = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
codex-windows-sandbox = { workspace = true }
codex-utils-process = { workspace = true }
codex-utils-pty = { workspace = true }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant"] }

[target.'cfg(windows)'.dependencies.windows-sys]
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Services",
]
version = "0.52"

