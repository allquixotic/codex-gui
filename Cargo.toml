[package]
name = "codex-gui"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"
autobins = false
repository = "https://github.com/allquixotic/codex-gui"
description = "Independent native Slint desktop front end embedding stable Codex"

[[bin]]
name = "codex-gui"
path = "src/main.rs"

[lib]
name = "codex_gui"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-ansi-escape = { workspace = true }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-async-utils = { workspace = true }
codex-models-manager = { workspace = true }
codex-aws-auth = { workspace = true }
codex-build-info = { workspace = true }
codex-cloud-config = { workspace = true }
codex-config = { workspace = true }
codex-context-fragments = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
codex-file-search = { workspace = true }
codex-lmstudio = { workspace = true }
codex-git-utils = { workspace = true }
codex-login = { workspace = true }
codex-model-provider = { workspace = true }
codex-ollama = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-rollout = { workspace = true }
codex-state = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-path-uri = { workspace = true }
codex-worktree = { workspace = true }
dirs = { workspace = true }
# `std::fs::canonicalize` without Windows `\\?\` verbatim prefixes.
dunce = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
# Version matches Slint: native glyph hit-testing and renderer invalidation.
i-slint-core = { version = "=1.18.1", features = ["shared-parley"] }
notify-rust = { workspace = true }
pulldown-cmark = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
slint = { workspace = true, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-femtovg",
    "renderer-femtovg-wgpu",
    "renderer-software",
    "accessibility",
    "raw-window-handle-06",
    # File drops from the OS reach the app only as winit window events
    # (`composer::drop`), and so do focus, theme, and (macOS) termination
    # requests (`lib.rs`, `platform.rs`); the slint version is pinned exactly
    # in the workspace.
    "unstable-winit-030",
    # Resolves fontconfig's `monospace` family on Linux (`app.rs`).
    "unstable-fontique-011",
] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
toml = { workspace = true }
toml_edit = { workspace = true }
url = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "v7"] }
webbrowser = { workspace = true }

# Slint's font discovery links fontconfig at build time unless it is loaded
# with dlopen; dlopen keeps Linux builds free of system -dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
i-slint-common = { version = "=1.18.1", features = ["fontconfig-dlopen"] }
# Probes for OpenGL libraries before choosing the renderer (`platform.rs`).
libc = { workspace = true }

# Intercepts `terminate:` (Cmd+Q, Dock › Quit) on winit's app delegate.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"

# Attaches to the parent console for `--help` and argument errors.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[package.metadata.cargo-shear]
# Only enabled for its `fontconfig-dlopen` feature (see above).
ignored = ["i-slint-common"]

[build-dependencies]
slint-build = { workspace = true, features = ["compat-1-18"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[workspace]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22.1"
clap = "4"
codex-ansi-escape = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-app-server-client = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-app-server-protocol = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-arg0 = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-async-utils = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-models-manager = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-aws-auth = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-build-info = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-cloud-config = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-config = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-context-fragments = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-exec-server = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-feedback = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-file-search = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-lmstudio = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-git-utils = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-login = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-model-provider = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-ollama = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-otel = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-protocol = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-rollout = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-state = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-utils-cli = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-utils-home-dir = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-utils-path-uri = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
codex-worktree = { git = "https://github.com/openai/codex", rev = "979011409de0a60b52f179721948e65531d26144" }
dirs = "6"
dunce = "1.0.4"
futures = { version = "0.3", default-features = false }
image = { version = "^0.25.9", default-features = false }
notify-rust = "4.18"
pulldown-cmark = { version = "0.10", default-features = false }
rfd = "0.17.2"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
shlex = "1.3.0"
similar = "2.7.0"
slint = { version = "=1.18.1", default-features = false }
thiserror = "2.0.17"
tokio = "1"
toml = "0.9.5"
toml_edit = "0.24.0"
url = "2"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.22"
uuid = "1"
webbrowser = "1.2.2"
libc = "0.2.182"
windows-sys = "0.61.2"
slint-build = { version = "=1.18.1", default-features = false }
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

[workspace.lints.rust]

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
strip = false

[patch.crates-io]
i-slint-core = { path = "third_party/slint/i-slint-core" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "efa177859fd9623d57b9fe7ae9bf491ae1ac6ec4" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
